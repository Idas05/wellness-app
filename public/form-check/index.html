<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Check Form</title>
    <style>
      :root {
        --bg: #faf7f2;
        --card: #ffffff;
        --ink: #2b2724;
        --muted: #6b645c;
        --line: #ece6dd;
        --good: #3e8e5a;
        --ok: #d9922e;
        --bad: #c8553d;
        --blue: #2b6cb0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      h1 { font-size: 26px; margin: 0; line-height: 1.15; }
      .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
      .close { background: none; border: 0; color: var(--blue); font-weight: 700; font-size: 15px; font-family: inherit; padding: 8px 0; cursor: pointer; white-space: nowrap; }
      .card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
      .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin: 0 0 8px; }
      .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; font-family: inherit; cursor: pointer; background: var(--ink); color: #fff; }
      .btn.light { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
      .btn:disabled { opacity: 0.4; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      ol { margin: 0; padding-left: 20px; }
      ol li { margin-bottom: 6px; }
      .stage { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; margin-bottom: 12px; }
      .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
      .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 12px; pointer-events: none; }
      .pill { background: rgba(0, 0, 0, 0.55); color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
      .reps { font-size: 22px; padding: 6px 14px; }
      .msg { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; }
      .msg .pill { display: inline-block; font-size: 15px; }
      .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 800; color: #fff; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); pointer-events: none; }
      .score { display: flex; align-items: center; gap: 16px; }
      .ring { --p: 0; --c: var(--good); width: 104px; height: 104px; border-radius: 50%; flex: none; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
      .ring > div { width: 84px; height: 84px; border-radius: 50%; background: var(--card); display: grid; place-items: center; text-align: center; }
      .ring b { font-size: 30px; line-height: 1; }
      .ring small { color: var(--muted); font-size: 12px; display: block; }
      .check { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
      .check:first-of-type { border-top: 0; }
      .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
      .check .name { flex: 1; min-width: 0; font-weight: 600; }
      .check .nums { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
      .tips li { margin-bottom: 8px; }
      .snap { width: 100%; border-radius: 14px; display: block; background: #000; }
      .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .err { color: var(--bad); font-weight: 600; }
      .hidden { display: none !important; }
      .small { font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Check Form</h1>
          <div class="sub" id="exercise-name"></div>
        </div>
        <button class="close" id="close">Close</button>
      </header>

      <section id="setup">
        <div class="card">
          <p class="label">Set up</p>
          <ol>
            <li id="setup-tip"></li>
            <li>Step back until your <span id="setup-joints"></span> are all in the picture.</li>
            <li>Tap Start, then do <b id="setup-reps">3–5 reps</b> at your normal weight.</li>
          </ol>
        </div>
        <button class="btn" id="start">Start camera</button>
        <p class="small" id="loading" style="text-align: center"></p>
        <p class="err" id="setup-error"></p>
      </section>

      <section id="live" class="hidden">
        <div class="stage mirror" id="stage">
          <video id="video" playsinline muted autoplay></video>
          <canvas id="overlay"></canvas>
          <div class="hud">
            <span class="pill reps" id="rep-count">0 reps</span>
            <span class="pill" id="timer"></span>
          </div>
          <div class="count" id="countdown"></div>
          <div class="msg"><span class="pill" id="live-msg">Get your whole body in frame</span></div>
        </div>
        <div class="row">
          <button class="btn light" id="flip">Flip camera</button>
          <button class="btn" id="finish">Finish</button>
        </div>
      </section>

      <section id="results" class="hidden">
        <div class="card score">
          <div class="ring" id="ring"><div><b id="score">0</b><small>/ 100</small></div></div>
          <div>
            <div style="font-size: 22px; font-weight: 800" id="score-label"></div>
            <div class="sub" id="score-sub"></div>
          </div>
        </div>
        <div class="card" id="tips-card">
          <p class="label">Pointers</p>
          <ul class="tips" id="tips"></ul>
        </div>
        <div class="card">
          <p class="label">Checks</p>
          <div id="checks"></div>
        </div>
        <div class="card" id="snap-card">
          <p class="label" id="snap-label">Your rep that needs the most work</p>
          <canvas class="snap" id="snap"></canvas>
          <div class="legend">
            <span><i class="dot" style="background: var(--good)"></i>Good</span>
            <span><i class="dot" style="background: var(--ok)"></i>Close</span>
            <span><i class="dot" style="background: var(--bad)"></i>Fix this</span>
          </div>
        </div>
        <div class="row">
          <button class="btn light" id="again">Try again</button>
          <button class="btn" id="done">Done</button>
        </div>
      </section>
    </main>
    <script type="module" src="./form-check.js"></script>
  </body>
</html>
